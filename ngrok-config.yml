# ngrok Configuration для 2 туннелей одновременно
# 
# Использование:
# 1. Скопируйте этот файл в: C:\Users\Youngest\.ngrok2\ngrok.yml
# 2. Запустите: ngrok start --all
#
# Или запустите из папки проекта: ngrok start --all --config ngrok-config.yml

version: "2"
authtoken: YOUR_NGROK_AUTH_TOKEN  # Замените на ваш токен с https://dashboard.ngrok.com/get-started/your-authtoken

tunnels:
  backend:
    addr: 3000
    proto: http
    inspect: true
    
  frontend:
    addr: 5173
    proto: http
    inspect: true
